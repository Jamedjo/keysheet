[package]
name = "sway-cheatsheet"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"

# Only the sheet links GTK; sway-keylist is a plain filter and has no business
# pulling a toolkit in. v4_12 is what CssProvider::load_from_string needs; the
# system GTK is 4.14.5, so the floor is comfortably met.
gtk = { version = "0.10.3", package = "gtk4", features = ["v4_12"], optional = true }

[features]
default = ["sheet"]
sheet = ["dep:gtk"]

[[bin]]
name = "sway-keylist"
path = "src/bin/sway-keylist.rs"

[[bin]]
name = "sway-cheatsheet"
path = "src/bin/sway-cheatsheet/main.rs"
required-features = ["sheet"]
